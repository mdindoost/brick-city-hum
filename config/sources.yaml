# Polling, endpoints and detection thresholds. SPEC §5 (config-as-data), §3.1, §3.2.
#
# Nothing here is hard-coded in TypeScript, because §3.2 says plainly that the
# detection thresholds are *starting values* to be tuned against recorded data.
# Tuning must never require a code change.

aircraft:
  # Poll radius around the origin. SPEC §3.2: ~25 nm covers EWR, Newark, Teterboro
  # and the LGA/JFK approaches overhead.
  radius_nm: 25

  # How long we keep per-aircraft history. SPEC §3.2 asks for ~10 observations;
  # at a 10 s interval that is 100 seconds of track, enough to see a climb develop.
  track:
    max_observations: 10
    # Forget an aircraft we have not seen for this long, so the store cannot grow
    # without bound over a day.
    expire_after_s: 300

  # Source chain. Tried in order; the first healthy one wins.
  # OpenSky (A3) is absent deliberately — SPEC §3.1 records that it is licence-gated
  # and disabled until written permission arrives (docs/verification.md).
  sources:
    - id: adsb.lol
      # Verified 2026-10-14: HTTP 200, 114 aircraft, no rate-limit headers at all,
      # so we cannot adapt to load and must stay conservative by design.
      url_template: 'https://api.adsb.lol/v2/point/{lat}/{lon}/{radius_nm}'
      interval_s: 10
      # Jitter spreads our requests so we never align with another client's cycle.
      jitter_s: 1.5
      timeout_ms: 8000
      enabled: true
    - id: adsb.fi
      # Verified 2026-10-14: same per-aircraft fields, but the list key is
      # `aircraft`, not `ac`. One parser handles both.
      url_template: 'https://opendata.adsb.fi/api/v2/lat/{lat}/lon/{lon}/dist/{radius_nm}'
      # Documented 1 req/s (unconfirmed from a primary source, so treated as a hard
      # ceiling). We poll far below it.
      interval_s: 15
      jitter_s: 2
      timeout_ms: 8000
      enabled: true

  # Backoff on 429 or 5xx. These are free services run by volunteers; when they push
  # back we retreat quickly and return slowly.
  # Wait this long after process start before the first poll, jittered.
  #
  # Added after rate-limiting ourselves: backoff state lives in memory, so every
  # container restart resets it and polls immediately. During development that meant
  # a dozen restarts in an hour each firing a request, and adsb.lol returned 429.
  # Under `restart: unless-stopped` a crash loop would do the same unattended. A few
  # seconds costs nothing and makes a restart storm look like one client, not many.
  startup_delay_ms: 4000
  startup_jitter_ms: 4000

  backoff:
    initial_ms: 5000
    multiplier: 2
    max_ms: 300000 # 5 minutes
    # Give up on a source and fail over after this many consecutive failures.
    failures_before_degraded: 3

# SPEC §3.2 event detection. STARTING VALUES — tune against the Phase 0 recordings.
detection:
  # An aircraft must leave a zone by this much more than it entered before it counts
  # as having left. Without hysteresis an aircraft hovering on the boundary flaps in
  # and out between polls and retriggers its voice every 10 seconds, which is the
  # "never chaotic" half of §1.4.
  exit_hysteresis_km: 0.6

  ewr_departure:
    within_nm_of_ewr: 4
    altitude_gate_ft: 1500
    min_climb_fpm: 500
    previous_below_ft: 500
    # How many consecutive on-ground observations count as real evidence of a
    # takeoff. One is not enough: a single spurious "ground" flag would otherwise
    # let a go-around pass the guard that exists to reject it.
    min_ground_observations: 2
    # A descent steeper than this anywhere earlier in the window means the aircraft
    # was approaching and abandoned it — a go-around, not a departure.
    go_around_descent_fpm: -200
  ewr_arrival:
    within_nm_of_ewr: 6
    altitude_gate_ft: 1000
    max_descent_fpm: -300
    # A single "ground" flag is not evidence of a landing. Low helicopters report
    # alt_baro: "ground" spuriously while airborne — in 38 minutes of live data, 190
    # of 285 aircraft had at least one onGround flip, and one produced the event
    # "a helicopter arriving at Newark" while climbing at +896 ft/min. A ground
    # transition now also requires the aircraft not to be climbing and to be slow
    # enough to be on a surface.
    max_landing_climb_fpm: 100
    max_landing_speed_kt: 80
    # A touchdown must be ON the airport, not merely near it. The 6 nm gate above is
    # right for spotting an APPROACH, but a helicopter landing at a Jersey City
    # heliport 3.2 nm away was captioned "arriving at Newark" — found by the P0-8
    # validation table before a human had to. EWR's furthest runway threshold is
    # about 1 nm from the airport reference point, so 2 nm covers the field with room
    # to spare while excluding the surrounding heliports.
    landing_within_nm_of_ewr: 2
  overflight_city:
    within_km_of_origin: 3
    below_ft: 10000
  overflight_high:
    within_km_of_origin: 3
    above_ft: 10000
  helicopter:
    emitter_category: A7
    # Emitter category alone misses real helicopters. A Bell 407 over the city on
    # 14/10/2026 broadcast category D0 — the "reserved" code, i.e. no category at
    # all — so it was never seen as a helicopter and was captioned "a plane over
    # the city". Transponder category is configured by hand and is often wrong or
    # absent; a type code is not. An aircraft matching EITHER is a helicopter.
    # Deliberately a short list of what actually flies over Newark, kept in step
    # with the "a helicopter" entries in aircraft_vocabulary.by_type below.
    type_codes:
      [
        S76,
        S92,
        B06,
        B407,
        B412,
        B429,
        B505,
        A109,
        A119,
        A139,
        A169,
        A189,
        EC30,
        EC35,
        EC45,
        EC55,
        AS50,
        AS65,
        R44,
        R66,
        H60,
      ]
    below_ft: 3000
    within_km_of_origin: 5
  heavy:
    emitter_category: A5

  # Distance rings around the listener (SPEC §6.4, §6.5).
  #
  # Measured on the 14/10 recording: 331 aircraft an hour come inside 46 km, 212 inside
  # 20 km, 61 inside 5 km — and only 8 inside the 3 km circle the old rules used. The
  # city was speaking 1.4 times a minute against §6.5's target band of 6–14, and the
  # other 95% of the sky was being thrown away.
  #
  # A ring fires when an aircraft crosses it **inward**, once per ring per track. Since
  # Newark airport is 5.57 km from the origin, every arrival and departure crosses the
  # 20 km and 10 km rings on its way, which gives an approach its own approach: a
  # distant tone, then a nearer one, then the figure. That build is the point as much
  # as the density is.
  # A fixed exit band is wrong for a 20 km ring: an aircraft wandering around the
  # boundary re-fired, and 1075 far-ring events came from 908 aircraft — the same
  # plane announced twice from the same direction, which is a small lie. The band
  # scales with the ring instead.
  ring_hysteresis_fraction: 0.08
  # Six radii, outermost first. One event per ring per track, so an aircraft coming
  # in from the horizon announces itself six times, each one nearer, louder and
  # brighter than the last — the distance mapping in §6.4 turns a list of numbers into
  # an approach. Measured on 14/10: the original rules heard 1.4 events a minute from
  # a sky that delivers 331 aircraft an hour.
  rings: [30, 20, 14, 10, 7, 5]

# PATH trains (SPEC §3.1 R3, §3.3).
#
# The Port Authority's own JSON, the one their departure boards use. No key, no
# documented rate limit, and no documented contract either — so it is treated as a
# courtesy: a 30 s interval with jitter, a short timeout, backoff on failure, and a
# User-Agent that says who we are. Verified live 2026-10-14.
#
# Why PATH first among the rail sources: it is keyless (NJ Transit needs a registered
# developer key), it runs every few minutes all day, and §6.4 gives it a bell — a
# struck sound against the aircraft's sustained ones, which is the variety the first
# listening round was missing as much as it was missing density.
rail:
  path:
    enabled: true
    url: 'https://www.panynj.gov/bin/portauthority/ridepath.json'
    poll_interval_ms: 30000
    jitter_ms: 6000
    timeout_ms: 8000
    # Station codes in the feed, mapped to entries in places.yaml. Newark Penn is
    # 1.5 km from campus and Harrison about 3.5 km, so distance already decides how
    # present each one is (§6.4).
    stations:
      NWK: newark_penn
      HAR: harrison_path
    # Two events per train, the same shape as the aircraft rings: one when it is a
    # few minutes out and one as it arrives, so a train has an approach.
    approaching_s: 240
    arriving_s: 45
    # The countdown must climb back above this before the same platform may fire
    # again — the next train, not the same one jittering across the threshold.
    rearm_s: 300

# How precisely an event reports itself, in decimal places.
#
# Accuracy beyond what a listener can perceive is not a goal, and reporting it is a
# small dishonesty: a bearing of 67.40309232334607° claims a precision that neither
# the source, the stereo field, nor the ear possesses. Amplitude panning resolves
# tens of degrees at best; nothing downstream can use a metre of distance. These are
# the figures an event is allowed to state, not the figures it is computed from —
# the geometry stays in full precision, and only the published event is rounded.
precision:
  bearing_deg: 0
  distance_km: 2
  salience: 3

# Base salience per event type, 0..1 (SPEC §4, §6.5). The density governor keeps the
# highest-salience events when the city is busier than the comfortable band and
# demotes the rest to texture, so these are a priority order as much as a loudness.
salience:
  # Far events are texture, near ones are the subject (§6.5). The governor keeps the
  # highest-salience events when the city is busy, so this is a priority order first
  # and a loudness second.
  # One base figure for every ring: the distance falloff below already makes a
  # 30 km crossing a sixth as salient as a 5 km one, so a per-ring number would be
  # the same decision written twice.
  sky: 0.34
  # A train is a near, certain, human-scale event: more salient than a distant
  # aircraft, less than a departure overhead.
  path_approaching: 0.3
  path_arrival: 0.55
  ewr_departure: 0.7
  ewr_arrival: 0.6
  overflight_city: 0.5
  overflight_high: 0.2
  helicopter: 0.55
  # Added to the base when the aircraft is category A5. SPEC §6.4 gives heavies a
  # lower, longer, warmer voice, so they also deserve to survive the governor.
  heavy_bonus: 0.15
  # Nearer events matter more. Salience is scaled by
  # (1 - distance_km / falloff_km), clamped to the floor and ceiling below.
  distance_falloff_km: 40
  proximity_floor: 0.2
  proximity_ceiling: 1.0

# Operator names, keyed on the ICAO callsign prefix (SPEC §3.2 as amended 2026-10-14:
# the airline may be named, the route may not — a date-less route lookup was measured
# wrong for 7 of 13 flights on 14/10, and a wrong destination is the one fact a
# listener standing under the aircraft can check).
#
# A closed allow-list, and the closure is the point.
#
#  - An unlisted prefix gets no name, so an unknown operator degrades to the
#    type-based caption rather than to a three-letter code.
#  - **Fractional and charter operators are deliberately absent.** EJA (NetJets),
#    LXJ (Flexjet), EJM and their kind file airline-format callsigns, so the collector
#    classifies them `airline` — but their flights are private business aviation, and
#    naming the operator of a private flight is what §3.2 forbids in substance if not
#    in letter. 66 of the 960 airline-format callsigns in the 14/10 recording were
#    fractional operators; none of them is listed here.
#  - Regional carriers are named as what they are (Republic, Endeavor, GoJet), not as
#    the mainline brand painted on the fuselage. §1.3: the caption states what is
#    true, and it is the regional that flies the callsign.
airlines:
  # Newark regulars, in order of how often they appeared in the 14/10 recording
  DAL: Delta
  RPA: Republic
  UAL: United
  AAL: American
  JBU: JetBlue
  EDV: Endeavor
  SWA: Southwest
  GJS: GoJet
  ASA: Alaska
  JIA: PSA
  ASH: Mesa
  PDT: Piedmont
  SKW: SkyWest
  NKS: Spirit
  FFT: Frontier
  AAY: Allegiant
  MXY: Breeze
  SCX: Sun Country
  HAL: Hawaiian
  # North America
  ACA: Air Canada
  JZA: Jazz
  ROU: Air Canada Rouge
  WJA: WestJet
  AMX: Aeromexico
  VOI: Volaris
  # Europe
  BAW: British Airways
  VIR: Virgin Atlantic
  AFR: Air France
  KLM: KLM
  DLH: Lufthansa
  SWR: Swiss
  AUA: Austrian
  BEL: Brussels Airlines
  SAS: SAS
  FIN: Finnair
  ICE: Icelandair
  EIN: Aer Lingus
  TAP: TAP Air Portugal
  IBE: Iberia
  LOT: LOT
  THY: Turkish Airlines
  # Rest of the world
  UAE: Emirates
  QTR: Qatar Airways
  ETD: Etihad
  ELY: El Al
  SVA: Saudia
  AIC: Air India
  SIA: Singapore Airlines
  ANA: All Nippon
  JAL: Japan Airlines
  CPA: Cathay Pacific
  CMP: Copa
  AVA: Avianca
  LAN: LATAM
  ARG: Aerolineas Argentinas
  BWA: Caribbean Airlines
  # Freight
  FDX: FedEx
  UPS: UPS
  GTI: Atlas Air

# Plain-English vocabulary for captions (SPEC §3.2 as amended).
#
# Spotter-grade type codes are noise to a listener: "a Gulfstream" is legible where
# "GLF4" is not. Keyed on ICAO type code, with emitter category as the fallback, and
# "a plane" as the floor. Deliberately a small closed vocabulary — this is a caption,
# not an aircraft database.
aircraft_vocabulary:
  by_type:
    P28A: a light propeller plane
    C172: a light propeller plane
    C152: a light propeller plane
    SR22: a light propeller plane
    DA40: a light propeller plane
    BE36: a light propeller plane
    C208: a small cargo plane
    PC12: a single-engine turboprop
    DH8D: a turboprop airliner
    AT72: a turboprop airliner
    GLF4: a Gulfstream
    GLF5: a Gulfstream
    GLF6: a Gulfstream
    GL7T: a Gulfstream
    CL30: a private jet
    CL35: a private jet
    CL60: a private jet
    C700: a private jet
    C56X: a private jet
    C25A: a small private jet
    C25B: a small private jet
    C25C: a small private jet
    E55P: a small private jet
    E545: a private jet
    E550: a private jet
    LJ60: a private jet
    LJ45: a private jet
    H25B: a private jet
    EC35: a helicopter
    EC30: a helicopter
    EC45: a helicopter
    EC55: a helicopter
    AS50: a helicopter
    AS65: a helicopter
    R44: a small helicopter
    R66: a small helicopter
    B06: a small helicopter
    B407: a helicopter
    B412: a helicopter
    B429: a helicopter
    B505: a small helicopter
    S76: a helicopter
    S92: a large helicopter
    A109: a helicopter
    A119: a helicopter
    A139: a helicopter
    A169: a helicopter
    A189: a helicopter
    H60: a military helicopter
  by_category:
    A1: a small plane
    A2: a small jet
    A3: an airliner
    A4: a large airliner
    A5: a heavy jet
    A6: a fast jet
    A7: a helicopter
    # NOTE: SPEC §3.2's amended text says "B2 helicopter". The ADS-B emitter set
    # defines B2 as lighter-than-air. The config is right and the spec sentence is
    # wrong; flagged in docs/decisions.md rather than silently differing.
    B2: a balloon
  # Used when the aircraft is NOT operating under an airline callsign. Without this,
  # a Bombardier Global Express (category A3, no airline callsign) is captioned "an
  # airliner" — which SPEC §3.2 wants as "a large private jet".
  by_category_private:
    A1: a light plane
    A2: a private jet
    A3: a large private jet
    A4: a large private jet
    A5: a large private jet
    A6: a private jet
    A7: a helicopter
  fallback: a plane

# The simulator: SPEC §3.5's labelled last resort, used only when every live source
# is down. Never silent (§1.4), never dishonest (§1.2) — everything it emits carries
# sim: true and says so in the caption.
simulator:
  enabled: true
  # How long every source must be down before the simulator takes over. Long enough
  # that a brief blip does not swap real traffic for a replay.
  takeover_after_s: 120
  # Deliberately quieter than the real city: a fallback should feel like the city
  # heard from further away, not like a full house.
  intensity: 0.6
  # Appended to every caption it produces. §3.5 requires replays to be captioned as
  # such, so a listener is never told a plane took off when it did not.
  caption_suffix: '(replay)'
  window_s: 10

# Caption templates. SPEC §5: the aircraft noun was already config, so the rest of
# the sentence belongs here too — half a tunable caption is not config-as-data.
# `{aircraft}` is the plain-English description, `{place}` the airport name.
captions:
  place: Newark
  ewr_departure: '✈ {aircraft} departing {place}'
  ewr_arrival: '✈ {aircraft} arriving at {place}'
  overflight_city: '✈ {aircraft} over the city'
  overflight_high: '✈ {aircraft} high above {place}'
  # Its own glyph: a helicopter captioned with ✈ appeared in the real recordings.
  helicopter: '🚁 {aircraft} crossing {place}'
  # Ring crossings name a direction rather than a place: it is what a person standing
  # on campus would actually say, and it gives the ticker the variety that "an airliner
  # arriving at Newark", twenty times an hour, does not.
  sky: '✈ {aircraft} to the {direction}'
  # Naming where it is going distinguishes the two platforms at one station, which
  # otherwise produce the same sentence twice in the ticker, and it is what the feed
  # actually tells us.
  path_approaching: '🚆 a PATH train to {toward} approaching {station}'
  path_arrival: '🚆 a PATH train to {toward} arriving at {station}'
  # Eight points, indexed from the bearing. Spoken English, not navigation: a listener
  # hears "north-east", never "045°".
  compass: [north, north-east, east, south-east, south, south-west, west, north-west]
  # Appended when, and only when, the operator resolves to a scheduled airline above.
  # A suffix rather than an inline word on purpose: "an airliner" carries its own
  # article, and splicing an operator into it produces "an United airliner".
  operator_suffix: ' · {operator}'
