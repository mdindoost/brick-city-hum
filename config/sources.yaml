# Polling, endpoints and detection thresholds. SPEC §5 (config-as-data), §3.1, §3.2.
#
# Nothing here is hard-coded in TypeScript, because §3.2 says plainly that the
# detection thresholds are *starting values* to be tuned against recorded data.
# Tuning must never require a code change.

aircraft:
  # Poll radius around the origin. SPEC §3.2: ~25 nm covers EWR, Newark, Teterboro
  # and the LGA/JFK approaches overhead.
  radius_nm: 25

  # How long we keep per-aircraft history. SPEC §3.2 asks for ~10 observations;
  # at a 10 s interval that is 100 seconds of track, enough to see a climb develop.
  track:
    max_observations: 10
    # Forget an aircraft we have not seen for this long, so the store cannot grow
    # without bound over a day.
    expire_after_s: 300

  # Source chain. Tried in order; the first healthy one wins.
  # OpenSky (A3) is absent deliberately — SPEC §3.1 records that it is licence-gated
  # and disabled until written permission arrives (docs/verification.md).
  sources:
    - id: adsb.lol
      # Verified 2026-10-14: HTTP 200, 114 aircraft, no rate-limit headers at all,
      # so we cannot adapt to load and must stay conservative by design.
      url_template: 'https://api.adsb.lol/v2/point/{lat}/{lon}/{radius_nm}'
      interval_s: 10
      # Jitter spreads our requests so we never align with another client's cycle.
      jitter_s: 1.5
      timeout_ms: 8000
      enabled: true
    - id: adsb.fi
      # Verified 2026-10-14: same per-aircraft fields, but the list key is
      # `aircraft`, not `ac`. One parser handles both.
      url_template: 'https://opendata.adsb.fi/api/v2/lat/{lat}/lon/{lon}/dist/{radius_nm}'
      # Documented 1 req/s (unconfirmed from a primary source, so treated as a hard
      # ceiling). We poll far below it.
      interval_s: 15
      jitter_s: 2
      timeout_ms: 8000
      enabled: true

  # Backoff on 429 or 5xx. These are free services run by volunteers; when they push
  # back we retreat quickly and return slowly.
  backoff:
    initial_ms: 5000
    multiplier: 2
    max_ms: 300000 # 5 minutes
    # Give up on a source and fail over after this many consecutive failures.
    failures_before_degraded: 3

# SPEC §3.2 event detection. STARTING VALUES — tune against the Phase 0 recordings.
detection:
  # An aircraft must leave a zone by this much more than it entered before it counts
  # as having left. Without hysteresis an aircraft hovering on the boundary flaps in
  # and out between polls and retriggers its voice every 10 seconds, which is the
  # "never chaotic" half of §1.4.
  exit_hysteresis_km: 0.6

  ewr_departure:
    within_nm_of_ewr: 4
    altitude_gate_ft: 1500
    min_climb_fpm: 500
    previous_below_ft: 500
  ewr_arrival:
    within_nm_of_ewr: 6
    altitude_gate_ft: 1000
    max_descent_fpm: -300
  overflight_city:
    within_km_of_origin: 3
    below_ft: 10000
  overflight_high:
    within_km_of_origin: 3
    above_ft: 10000
  helicopter:
    emitter_category: A7
    below_ft: 3000
    within_km_of_origin: 5
  heavy:
    emitter_category: A5

# Base salience per event type, 0..1 (SPEC §4, §6.5). The density governor keeps the
# highest-salience events when the city is busier than the comfortable band and
# demotes the rest to texture, so these are a priority order as much as a loudness.
salience:
  ewr_departure: 0.7
  ewr_arrival: 0.6
  overflight_city: 0.5
  overflight_high: 0.2
  helicopter: 0.55
  # Added to the base when the aircraft is category A5. SPEC §6.4 gives heavies a
  # lower, longer, warmer voice, so they also deserve to survive the governor.
  heavy_bonus: 0.15
  # Nearer events matter more. Salience is scaled by
  # (1 - distance_km / falloff_km), clamped to [0.2, 1].
  distance_falloff_km: 40

# Plain-English vocabulary for captions (SPEC §3.2 as amended).
#
# Spotter-grade type codes are noise to a listener: "a Gulfstream" is legible where
# "GLF4" is not. Keyed on ICAO type code, with emitter category as the fallback, and
# "a plane" as the floor. Deliberately a small closed vocabulary — this is a caption,
# not an aircraft database.
aircraft_vocabulary:
  by_type:
    P28A: a light propeller plane
    C172: a light propeller plane
    C152: a light propeller plane
    SR22: a light propeller plane
    DA40: a light propeller plane
    BE36: a light propeller plane
    C208: a small cargo plane
    PC12: a single-engine turboprop
    DH8D: a turboprop airliner
    AT72: a turboprop airliner
    GLF4: a Gulfstream
    GLF5: a Gulfstream
    GLF6: a Gulfstream
    GL7T: a Gulfstream
    CL30: a private jet
    CL35: a private jet
    CL60: a private jet
    C700: a private jet
    C56X: a private jet
    C25A: a small private jet
    C25B: a small private jet
    C25C: a small private jet
    E55P: a small private jet
    E545: a private jet
    E550: a private jet
    LJ60: a private jet
    LJ45: a private jet
    H25B: a private jet
    EC35: a helicopter
    EC30: a helicopter
    AS50: a helicopter
    R44: a small helicopter
    R66: a small helicopter
    B06: a small helicopter
    S76: a helicopter
    A139: a helicopter
  by_category:
    A1: a small plane
    A2: a small jet
    A3: an airliner
    A4: a large airliner
    A5: a heavy jet
    A6: a fast jet
    A7: a helicopter
    B2: a balloon
  fallback: a plane
