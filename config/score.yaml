# Musical and visual values. SPEC §1.5, §5: everything tunable lives here and never in
# a .ts file, because the aesthetic is tuned forever after launch and the music
# director must not need a code change to try an idea.
#
# Phase 1 adds the voices. What exists so far is the picture and the shared clock.

# How far ahead of now the server schedules an event, in milliseconds (SPEC §9.4).
# Every listener renders and plays the same event at the same instant, so the lead has
# to cover the slowest reasonable connection without making the radio feel late.
play_lead_ms: 1500

# The density governor (SPEC §6.5, §9.2). Runs on the server, so it is authoritative
# and identical for every listener; the client's voice cap is only a safety net.
#
# It exists because the city does not deliver a comfortable event rate on its own. The
# 14/10 recording gives 20 events a minute through the distance rings, and the first
# attempt at rendering that drove the master limiter to 0.0 dBTP with 10% of events
# dropped by the voice budget — crude triage by whichever event happened to arrive
# when the budget was full, rather than by what was worth hearing.
governor:
  window_s: 60
  # Events per minute that should reach the foreground, by daypart (§6.5). Everything
  # above the ceiling is demoted to texture rather than dropped: it still happened,
  # and §1.3 says every sound traces to a real event — not that every event must
  # become a loud one.
  day_from_hour: 7
  night_from_hour: 22
  # §6.5's "e.g. night 2–6, day 6–14; tune" — and tuned. At 14 a minute a listener
  # described the result as too sparse to follow, and the raw rate the rings now
  # produce is 83 a minute, so the ceiling was the binding constraint rather than the
  # city. These are high for an ambient piece and will stay high only while the
  # voices are sustained tones; the next musical round is struck sounds, which carry
  # a far higher rate without turning into a wash.
  day: { min: 10, max: 45 }
  night: { min: 4, max: 18 }
  # What a demoted event is played at, relative to its own voice.
  texture_gain: 0.45

visual:
  # The map is centred on the listener, not on the airport — SPEC §1.1, you are
  # standing at NJIT. Anything beyond the horizon is simply not drawn.
  horizon_km: 40
  # Distance rings, in km. Newark airport sits at 5.57 km, so the 5 km ring reads as
  # "the airport" without a label having to claim it.
  rings_km: [5, 10, 20, 40]
  # Seconds an event stays on the map after it fires, and how long it takes to appear.
  # It announces itself by growing, never by flashing: SPEC §10 forbids anything
  # faster than 3 Hz anywhere, ever (photosensitive epilepsy).
  event_life_s: 50
  arrival_grow_s: 1.2
  # The caption ticker.
  caption_lines: 8
  caption_life_s: 120

# ---------------------------------------------------------------------------------
# Sound. SPEC §6. Every number here is a default for the music director to tune (§7),
# and the server ships this block to the browser so the client holds no tuning value
# of its own.
#
# Phase 1 is one palette. §6.2's six dayparts, the weather modifiers and the harmonic
# walk are Phase 2 — this is the fixed afternoon the rest will vary from.
audio:
  # The master chain (§6.8). These were hard-coded in engine.ts, which by §1.5 is a
  # bug: the loudness target is explicitly "[HUMAN] tune by ear; measure in the lab",
  # and a number the music director cannot reach is a number that never gets tuned.
  master:
    # Trim before the compressor. The lab measures integrated loudness; this is how it
    # gets moved without touching the balance between the ground and the voices.
    gain_db: 0
    # Harshness is what makes an ambient piece unlistenable over hours (§6.8).
    high_shelf_hz: 6000
    high_shelf_db: -6
    compressor_threshold_db: -24
    compressor_ratio: 2.5
    compressor_attack_s: 0.05
    compressor_release_s: 0.4
    # Last thing before the output. Set below §6.8's −1 dBTP on purpose: a limiter
    # works on samples, and reconstruction between them overshoots. Measured: with
    # the ceiling at −1 the render came back at −0.8 dBTP, i.e. over the spec.
    limiter_ceiling_db: -1.5
    # Impulse-response length of the shared reverb, in seconds.
    reverb_decay_s: 4

  transport:
    # Slow enough that quantisation feels like breathing rather than rhythm (§6.3).
    bpm: 66
    # Events land on the next half-beat. At 66 BPM that is a 455 ms grid: tight enough
    # that the city "falls into" the music, loose enough that nothing sounds drilled.
    quantize_beats: 0.5

  # Palettes by daypart (§6.2). The sky collector decides which is current from the
  # sun's altitude, so these follow the actual sky and stay right across the year.
  #
  # This is the honest form of "make it brighter": the day really is brighter than
  # three in the morning, and a listener who leaves the page open hears the city
  # change colour because the city changed colour.
  palettes:
    night:
      # Minor pentatonic, low and dark. The fifth is left bare in the ground.
      root_midi: 55
      scale: [0, 3, 5, 7, 10]
      ground_cutoff_hz: 300
      ground_gain: 0.22
    twilight:
      root_midi: 60
      scale: [0, 2, 3, 5, 7, 10]
      ground_cutoff_hz: 380
      ground_gain: 0.24
    low_sun:
      root_midi: 62
      scale: [0, 2, 4, 7, 9]
      ground_cutoff_hz: 480
      ground_gain: 0.26
    day:
      # Major pentatonic, a fourth higher and twice as open. Nothing here can make a
      # wrong note; what changes is where the light is.
      root_midi: 67
      scale: [0, 2, 4, 7, 9]
      ground_cutoff_hz: 620
      ground_gain: 0.26

  palette:
    name: afternoon
    # D minor pentatonic. §6.2 says "no wrong notes, ever", and a pentatonic is the
    # only scale where that is true by construction: every pair of degrees is
    # consonant, so an event arriving on any degree against any drone still works.
    # Modes with semitones (Dorian, Aeolian) arrive in Phase 2 with the palettes,
    # when a harmonic walk exists to resolve them.
    root_midi: 62 # D4
    scale: [0, 2, 4, 7, 9]

  # The Ground layer (§6.1): the air of the city, always there, never the subject.
  ground:
    # Root and fifth, two octaves down. A bare fifth leaves the third undefined, so
    # event notes may colour the harmony either way without ever contradicting it.
    midi: [38, 45]
    gain: 0.26
    attack_s: 8
    # Mutually prime loop lengths (§6.7.1 — the Music for Airports technique). Their
    # combination repeats once every 17 × 23 × 31 ≈ 3.4 hours.
    loop_s: [17, 23, 31]
    # Slow filter and level movement, also on prime periods (§6.7.2).
    lfo_s: [43, 61, 79]
    cutoff_hz: 420
    cutoff_sweep_hz: 180

  voices:
    # Levels here were set against a sky that spoke 1.4 times a minute. At 20 a minute
    # their sum drove the master limiter to 0.0 dBTP — over §6.8's ceiling and audibly
    # squashed. Density is loudness; adding events means taking level away.
    max_desktop: 40
    max_mobile: 20
    # §6.8: no sudden transients. Every voice's attack is clamped to at least this.
    min_attack_s: 0.005

    ewr_departure:
      # A rising figure (§6.4). Three notes reads as a gesture; two reads as an
      # interval and four starts to sound like a melody competing for attention.
      notes: 3
      step_degrees: 2
      attack_s: 0.02
      release_s: 2.4
      # Climb rate sets glide speed: a steep climb hurries the figure along.
      gap_beats_slow: 1.0
      gap_beats_fast: 0.4
      vrate_fast_fpm: 2500
      gain: 0.55

    ewr_arrival:
      # Falling, with a softer attack (§6.4) — the difference in attack is what makes
      # the two read as opposites even when the listener is not attending.
      notes: 3
      step_degrees: 2
      attack_s: 0.12
      release_s: 3.2
      gap_beats_slow: 1.2
      gap_beats_fast: 0.5
      vrate_fast_fpm: 1800
      gain: 0.5

    overflight_city:
      # A sustained tone, not a figure: the aircraft is passing over, not arriving.
      attack_s: 1.6
      hold_s: 4.0
      release_s: 5.0
      # Two oscillators a few cents apart, which beats slowly and gives the tone the
      # width a single oscillator cannot have.
      detune_cents: 7
      # A barely-there pitch drift, the Doppler hint of §6.4 — well under the ~6 cent
      # threshold where a listener starts hearing it as being out of tune.
      bend_cents: 4
      gain: 0.38

    overflight_high:
      # "Barely audible shimmer" (§6.4). It should be noticed only in its absence.
      attack_s: 3.0
      release_s: 6.0
      gain: 0.13
      # Two octaves up: present in the air without occupying any register the city
      # voices use.
      octave_offset: 2

    helicopter:
      # A flutter, not a note. The tremolo rate is the identifying feature, and it is
      # deliberately slower than a real rotor — a real 5–8 Hz beat is agitating, and
      # §1.4 wants this pleasant for hours.
      tremolo_hz: 5.5
      tremolo_depth: 0.7
      attack_s: 0.4
      hold_s: 2.5
      release_s: 2.0
      gain: 0.34

    # Ring crossings (§6.5). Texture, not subject: a single soft tone whose register
    # comes from altitude like everything else, so the sky has a quiet continuous
    # activity under the named events rather than silence between them.
    sky:
      attack_s: 0.35
      release_s: 3.5
      gain: 0.18

    # PATH trains (§6.4: "each line has its own bell or chime pitch set").
    #
    # A struck sound against the aircraft's sustained ones. That contrast is the
    # point: the first listening round was missing variety as much as it was missing
    # density, and a second family of sustained tones would have added neither.
    #
    # FM with a non-integer ratio gives an inharmonic partial — the metallic edge a
    # bell has and a sine does not — kept mild so it stays warm rather than glassy.
    path:
      harmonicity: 3.1
      modulation_index: 7
      attack_s: 0.004
      decay_s: 0.35
      release_s: 2.6
      # The approach is the same bell, quieter and an octave up: the same sound
      # arriving from further away in the mind's ear.
      approach_octave: 1
      approach_gain: 0.14
      arrival_gain: 0.32

    # Listener taps (§8). Three instrument families by where the screen was touched:
    # top = bells, middle = mallet, bottom = soft piano. All struck, because a tap is
    # a gesture a person made at an instant and anything with a slow attack would
    # arrive after the finger left.
    tap:
      attack_s: 0.002
      decay_s: 0.6
      release_s: 2.2
      gain: 0.55
      # Harmonicity per register: higher is more bell-like, lower is woodier.
      harmonicity: [1.4, 2.2, 3.6]
      modulation_index: [3, 6, 11]
      octave_offset: [-1, 0, 1]

    # A heavy aircraft is lower, longer and warmer (§6.4). A modifier, not a voice.
    heavy:
      octave_offset: -1
      release_multiplier: 1.5
      cutoff_multiplier: 0.6
