# Musical and visual values. SPEC §1.5, §5: everything tunable lives here and never in
# a .ts file, because the aesthetic is tuned forever after launch and the music
# director must not need a code change to try an idea.
#
# Phase 1 adds the voices. What exists so far is the picture and the shared clock.

# How far ahead of now the server schedules an event, in milliseconds (SPEC §9.4).
# Every listener renders and plays the same event at the same instant, so the lead has
# to cover the slowest reasonable connection without making the radio feel late.
play_lead_ms: 1500

# The density governor (SPEC §6.5, §9.2). Runs on the server, so it is authoritative
# and identical for every listener; the client's voice cap is only a safety net.
#
# It exists because the city does not deliver a comfortable event rate on its own. The
# 14/10 recording gives 20 events a minute through the distance rings, and the first
# attempt at rendering that drove the master limiter to 0.0 dBTP with 10% of events
# dropped by the voice budget — crude triage by whichever event happened to arrive
# when the budget was full, rather than by what was worth hearing.
governor:
  window_s: 60
  # Events per minute that should reach the foreground, by daypart (§6.5). Everything
  # above the ceiling is demoted to texture rather than dropped: it still happened,
  # and §1.3 says every sound traces to a real event — not that every event must
  # become a loud one.
  day_from_hour: 7
  night_from_hour: 22
  # §6.5's "e.g. night 2–6, day 6–14; tune" — and tuned. At 14 a minute a listener
  # described the result as too sparse to follow, and the raw rate the rings now
  # produce is 83 a minute, so the ceiling was the binding constraint rather than the
  # city. These are high for an ambient piece and will stay high only while the
  # voices are sustained tones; the next musical round is struck sounds, which carry
  # a far higher rate without turning into a wash.
  day: { min: 10, max: 45 }
  night: { min: 4, max: 18 }
  # What a demoted event is played at, relative to its own voice.
  texture_gain: 0.45

# The release queue (§1.4, §6.3). One poll of the ADS-B feed is one batch, and every
# event in a batch shares one `play_at` — so 684 events in six minutes arrived as 25
# chords of sixteen notes with eleven seconds of drone between them, one of which held
# 161 events. The rate was right and the rhythm was a pulse. These numbers turn the
# batch back into a stream.
spread:
  # How often the server releases. 250 ms is the demo server's existing tick and is
  # well inside `play_lead_ms`, so a released event is still comfortably in the future
  # by the time it reaches a browser.
  tick_ms: 250
  # Spread a batch over roughly the gap to the next one: the measured median is 11.3 s
  # and the aircraft poll is 10 s, so nine seconds empties the queue just before the
  # next poll lands rather than fighting it. At real speed, that is — the demo server
  # defaults to REPLAY_SPEED=4, where batches arrive every 2.8 s and three or four
  # windows are always in flight.
  window_s: 9
  # The ceiling on one tick, which is what stops the 161-event batch from becoming a
  # chord again: three notes inside 250 ms is a gesture, sixteen is a wash.
  #
  # This is not three *audible* notes. The client quantises onto 0.5 beats (455 ms at
  # 66 BPM), so two ticks can land on one instant: measured over the six-minute slice,
  # 320 grid points carry the 586 events, 22 of them with six notes. Six is the real
  # ceiling until `tick_ms` and the grid are reconciled, which is a musical choice and
  # waits for a listening verdict on the pacing as it stands.
  max_per_tick: 3
  # Past this an event is released whatever the queue looks like. §1.3 asks that every
  # note trace to a real event in the last seconds or minutes; thirty seconds is still
  # true, and a queue deep enough to hold anything longer is a city we are not keeping
  # up with — better late and audible than silently discarded.
  max_delay_s: 30

visual:
  # The map is centred on the listener, not on the airport — SPEC §1.1, you are
  # standing at NJIT. Anything beyond the horizon is simply not drawn.
  horizon_km: 40
  # Distance rings, in km. Newark airport sits at 5.57 km, so the 5 km ring reads as
  # "the airport" without a label having to claim it.
  rings_km: [5, 10, 20, 40]
  # Seconds an event stays on the map after it fires, and how long it takes to appear.
  # It announces itself by growing, never by flashing: SPEC §10 forbids anything
  # faster than 3 Hz anywhere, ever (photosensitive epilepsy).
  event_life_s: 50
  arrival_grow_s: 1.2
  # The caption ticker.
  caption_lines: 8
  caption_life_s: 120

# ---------------------------------------------------------------------------------
# Sound. SPEC §6. Every number here is a default for the music director to tune (§7),
# and the server ships this block to the browser so the client holds no tuning value
# of its own.
#
# Phase 1 is one palette. §6.2's six dayparts, the weather modifiers and the harmonic
# walk are Phase 2 — this is the fixed afternoon the rest will vary from.
audio:
  # The master chain (§6.8). These were hard-coded in engine.ts, which by §1.5 is a
  # bug: the loudness target is explicitly "[HUMAN] tune by ear; measure in the lab",
  # and a number the music director cannot reach is a number that never gets tuned.
  master:
    # The whole mix, Ground included, just before the limiter. The lab measures
    # integrated loudness and this is the number that moves it.
    #
    # Negative on purpose. At 0 the first render of the sampled voices measured −19.9
    # LUFS and −0.9 dBTP with the limiter working in 7% of 100 ms windows — legal, and
    # the wrong kind of legal: a limiter riding the gain one window in fourteen is a
    # mix element rather than the safety net §6.8 wants it to be, and struck voices
    # stack into far higher peaks than the sustained tones this was first set against.
    # At −1 the same minute measures **−20.9 LUFS, −1.9 dBTP, and the limiter never
    # engages at all** — §6.8's two numbers met with margin instead of by luck, for
    # 0.9 dB of loudness.
    gain_db: -1
    # Harshness is what makes an ambient piece unlistenable over hours (§6.8).
    high_shelf_hz: 6000
    high_shelf_db: -6
    compressor_threshold_db: -24
    compressor_ratio: 2.5
    compressor_attack_s: 0.05
    compressor_release_s: 0.4
    # How far forward every event voice sits against the Ground, in dB.
    #
    # This is the knob `docs/music/decisions.md` has had open since round 1 as "the
    # question only ears can answer", and until now there was no number for it — the
    # balance was whatever the sum of the individual voice gains happened to give.
    #
    # Measured properly, by rendering the same six minutes with the Ground silenced:
    # at +5 the voices are −27.6 LUFS against the drone's −22.6, so **the drone is
    # 5 dB over the city**; at 0, where this started, it was 10 dB over, and 93% of
    # the piece's tonal energy was the drone's own root and fifth. A struck note
    # decays, so it adds far less average energy than the sustained oscillator it
    # replaced — the two renders hit the same −20 LUFS with the voices 3.6 dB further
    # back. §6.1 says the Ground is never the subject, so this corrects a balance
    # that had drifted rather than choosing a new one.
    #
    # Do not measure this by filtering a finished render into bands. The first attempt
    # did, called it a 15 dB gap, and was wrong: the Ground's own lowpass sits at
    # 420–620 Hz, so a ">300 Hz" band is full of drone and a 4 dB change in the voices
    # moves it by 2.3. Silence the Ground and render again; it costs one render.
    #
    # [HUMAN] this is the single number to A/B by ear. Round 3 offers +5, where the
    # drone sits 5 dB over the city, against +9, where the two are within a decibel
    # of each other.
    voices_gain_db: 5
    # Last thing before the output. Set below §6.8's −1 dBTP on purpose: a limiter
    # works on samples, and reconstruction between them overshoots. Measured: with
    # the ceiling at −1 the render came back at −0.8 dBTP, i.e. over the spec.
    limiter_ceiling_db: -1.5
    # Impulse-response length of the shared reverb, in seconds.
    reverb_decay_s: 4

  transport:
    # Slow enough that quantisation feels like breathing rather than rhythm (§6.3).
    bpm: 66
    # Events land on the next half-beat. At 66 BPM that is a 455 ms grid: tight enough
    # that the city "falls into" the music, loose enough that nothing sounds drilled.
    quantize_beats: 0.5

  # Palettes by daypart (§6.2). The sky collector decides which is current from the
  # sun's altitude, so these follow the actual sky and stay right across the year.
  #
  # This is the honest form of "make it brighter": the day really is brighter than
  # three in the morning, and a listener who leaves the page open hears the city
  # change colour because the city changed colour.
  palettes:
    night:
      # Minor pentatonic, low and dark. The fifth is left bare in the ground.
      root_midi: 55
      scale: [0, 3, 5, 7, 10]
      ground_cutoff_hz: 300
      ground_gain: 0.22
    twilight:
      root_midi: 60
      scale: [0, 2, 3, 5, 7, 10]
      ground_cutoff_hz: 380
      ground_gain: 0.24
    low_sun:
      root_midi: 62
      scale: [0, 2, 4, 7, 9]
      ground_cutoff_hz: 480
      ground_gain: 0.26
    day:
      # Major pentatonic, a fourth higher and twice as open. Nothing here can make a
      # wrong note; what changes is where the light is.
      root_midi: 67
      scale: [0, 2, 4, 7, 9]
      ground_cutoff_hz: 620
      ground_gain: 0.26

  palette:
    name: afternoon
    # D minor pentatonic. §6.2 says "no wrong notes, ever", and a pentatonic is the
    # only scale where that is true by construction: every pair of degrees is
    # consonant, so an event arriving on any degree against any drone still works.
    # Modes with semitones (Dorian, Aeolian) arrive in Phase 2 with the palettes,
    # when a harmonic walk exists to resolve them.
    root_midi: 62 # D4
    scale: [0, 2, 4, 7, 9]

  # The Ground layer (§6.1): the air of the city, always there, never the subject.
  ground:
    # A recording of a bowed contrabass, not three oscillators.
    #
    # Mohammad's diagnosis after four rounds, and it was right: "I think that
    # background noise is there because you are synthesising it." The bed was three
    # triangle oscillators at 73 and 110 Hz behind a 420 Hz lowpass — which is not a
    # drone, it is the sound of a transformer. Nothing in it was ever bowed, blown or
    # struck, and it is the loudest and most continuous thing in the piece.
    #
    # `oscillator` keeps the old bed, for the A/B and as the fallback if the kit has
    # not loaded. Sustained non-vibrato, because vibrato is a wobble with a period of
    # its own and §6.7.1 is about not having one of those.
    source: sample
    instrument: contrabass
    # The fade at each end of one entry. Each entry plays the whole recording once and
    # the next begins `body − swell_s` later, so one is always rising while the other
    # falls and the bed has no loop point at all. Four seconds is long enough to hide
    # a bow attack, which is the one part of a real sustained note that would give the
    # entry away.
    swell_s: 4
    # Root and fifth, two octaves down. A bare fifth leaves the third undefined, so
    # event notes may colour the harmony either way without ever contradicting it.
    #
    # The contrabass kit has both notes at pitch: VSCO 2 CE names them D1 and A1, and
    # that library counts middle C as C3, so they are MIDI 38 and 45 exactly. Nothing
    # is bent, which matters more here than anywhere else — a stretched sample sounds
    # stretched, and this one plays for hours.
    midi: [38, 45]
    gain: 0.68
    attack_s: 8
    # Mutually prime loop lengths (§6.7.1 — the Music for Airports technique). Their
    # combination repeats once every 17 × 23 × 31 ≈ 3.4 hours.
    loop_s: [17, 23, 31]
    # Slow filter and level movement, also on prime periods (§6.7.2).
    lfo_s: [43, 61, 79]
    cutoff_hz: 420
    cutoff_sweep_hz: 180

  # The CC0 sample kits (§6.9, §12). Built by `npm run samples`; every file's VCSL
  # source, dynamic layer and gain is listed in client/public/samples/LICENSE.md.
  #
  # This is the change the first two listening rounds asked for. The verdict both
  # times was the same — background noise, no musical feeling, and about Listen to
  # Wikipedia, "as if someone was really playing a note". That piece plays recorded
  # samples; ours played sine and triangle oscillators, and an oscillator has no
  # strike in it. §6.9 permits VCSL and VSCO 2 CE, both CC0, so the aircraft now play
  # marimba, vibraphone, tubular bells, glockenspiel and harp.
  samples:
    base_url: /samples/

  voices:
    # Levels here were set against a sky that spoke 1.4 times a minute. At 20 a minute
    # their sum drove the master limiter to 0.0 dBTP — over §6.8's ceiling and audibly
    # squashed. Density is loudness; adding events means taking level away.
    max_desktop: 40
    max_mobile: 20
    # §6.8: no sudden transients. Every voice's attack is clamped to at least this.
    min_attack_s: 0.005

    ewr_departure:
      # A rising figure (§6.4). Three notes reads as a gesture; two reads as an
      # interval and four starts to sound like a melody competing for attention.
      #
      # Marimba: woody and definite, with the shortest decay of the five kits. A
      # rising figure needs each note to land and then get out of the way of the next.
      instrument: marimba
      # The kit's own range is MIDI 41–96, so almost nothing folds.
      register: [41, 96]
      notes: 3
      step_degrees: 2
      # The sample's attack is the attack now. This is only a taper on the front of
      # it, kept at §6.8's 5 ms minimum so the strike survives.
      fade_in_s: 0.005
      max_s: 2.0
      fade_out_s: 0.5
      # Climb rate sets glide speed: a steep climb hurries the figure along.
      gap_beats_slow: 1.0
      gap_beats_fast: 0.4
      vrate_fast_fpm: 2500
      gain: 0.5

    ewr_arrival:
      # Falling (§6.4). The two read as opposites through their instruments now
      # rather than through their attack times: a marimba is dry and a vibraphone
      # rings, so a departure is three definite strikes and an arrival is three notes
      # settling into each other.
      instrument: vibraphone
      register: [48, 90]
      notes: 3
      step_degrees: 2
      fade_in_s: 0.012
      max_s: 3.5
      fade_out_s: 0.9
      gap_beats_slow: 1.2
      gap_beats_fast: 0.5
      vrate_fast_fpm: 1800
      gain: 0.45

    overflight_city:
      # One sound, not a figure: the aircraft is passing over, not arriving.
      #
      # A tubular bell is the one struck sound that reads as sustained — it rings for
      # the length the old oscillator pair held, and its partials beat against each
      # other the way the two detuned sines were trying to imitate.
      instrument: chimes
      # Two and a half octaves against a kit that spans sixteen semitones (MIDI
      # 72–88), so a low overflight is a chime bent down an octave: slower, darker,
      # closer to a gong. For something heavy directly overhead that is the right
      # sound, and it is the honest consequence of a nine-file kit.
      register: [60, 91]
      fade_in_s: 0.01
      max_s: 7.0
      fade_out_s: 1.5
      # The Doppler hint of §6.4, now a real one: the playback rate drifts across the
      # pass, so the pitch and the timbre move together as they do on a passing
      # aircraft. Well under the ~6 cents where a listener stops hearing "moving" and
      # starts hearing "out of tune".
      bend_cents: 4
      gain: 0.32

    overflight_high:
      # "Barely audible shimmer" (§6.4). It should be noticed only in its absence.
      #
      # A glockenspiel already lives up here — MIDI 79–108 — so the old two-octave
      # offset is gone: the register is the offset.
      instrument: glockenspiel
      register: [79, 108]
      # Slower than the others. A shimmer should appear rather than strike.
      fade_in_s: 0.02
      max_s: 3.5
      fade_out_s: 1.0
      gain: 0.12

    helicopter:
      # A flutter, not a note. The tremolo rate is the identifying feature, and it is
      # deliberately slower than a real rotor — a real 5–8 Hz beat is agitating, and
      # §1.4 wants this pleasant for hours.
      tremolo_hz: 5.5
      tremolo_depth: 0.7
      attack_s: 0.4
      hold_s: 2.5
      release_s: 2.0
      gain: 0.34

    # Ring crossings (§6.5). Texture, not subject: a single soft tone whose register
    # comes from altitude like everything else, so the sky has a quiet continuous
    # activity under the named events rather than silence between them.
    sky:
      # A harp, and not the obvious choice of a kalimba: both of VCSL's lamellophones
      # are tuned the way a real mbira is tuned, and one measured three semitones
      # flat. For any other voice that is character; this is the most frequent sound
      # in the piece, and §6.2 promises no wrong notes, ever.
      instrument: harp
      register: [48, 96]
      fade_in_s: 0.008
      max_s: 2.0
      fade_out_s: 0.5
      gain: 0.16

    # Crossing an altitude threshold, either way (§6.5).
    #
    # This event type had no voice. It is 9% of everything the city makes — a hundred
    # and sixty crossings an hour — and every one of them was captioned on the page,
    # drawn on the map, and silent, because no voice's `handles` ever claimed it.
    #
    # A vibraphone rather than the glockenspiel, which would have been the obvious
    # neighbour: `overflight_high` is "noticed only in its absence" at a rare event's
    # gain, and a high ping every few seconds is a tick, not a sound. The vibraphone
    # rings lower and rounder and sits under the harp.
    #
    # The pitch needs nothing new. Altitude already chooses the scale degree (§6.4),
    # and the seven thresholds land on seven different degrees — so an aircraft
    # climbing out of EWR plays an ascending line across its whole climb, one note per
    # threshold, and a descent plays the same line falling. No field was added to the
    # event for this: the recordings are history and cannot be migrated.
    altitude_band:
      instrument: vibraphone
      # The kit is MIDI 53–88, so the window bends almost nothing.
      register: [60, 84]
      fade_in_s: 0.01
      max_s: 2.5
      fade_out_s: 0.8
      # Against the harp's 0.16 at nine times as many events.
      gain: 0.14

    # PATH trains (§6.4: "each line has its own bell or chime pitch set").
    #
    # A struck sound against the aircraft's sustained ones. That contrast is the
    # point: the first listening round was missing variety as much as it was missing
    # density, and a second family of sustained tones would have added neither.
    #
    # FM with a non-integer ratio gives an inharmonic partial — the metallic edge a
    # bell has and a sine does not — kept mild so it stays warm rather than glassy.
    path:
      harmonicity: 3.1
      modulation_index: 7
      attack_s: 0.004
      decay_s: 0.35
      release_s: 2.6
      # The approach is the same bell, quieter and an octave up: the same sound
      # arriving from further away in the mind's ear.
      approach_octave: 1
      approach_gain: 0.14
      arrival_gain: 0.32

    # Listener taps (§8). Three instrument families by where the screen was touched:
    # top = bells, middle = mallet, bottom = soft piano. All struck, because a tap is
    # a gesture a person made at an instant and anything with a slow attack would
    # arrive after the finger left.
    tap:
      attack_s: 0.002
      decay_s: 0.6
      release_s: 2.2
      gain: 0.55
      # Harmonicity per register: higher is more bell-like, lower is woodier.
      harmonicity: [1.4, 2.2, 3.6]
      modulation_index: [3, 6, 11]
      octave_offset: [-1, 0, 1]

    # A heavy aircraft is lower, longer and warmer (§6.4). A modifier, not a voice.
    #
    # The octave drop now survives only where the voice's register has room for it:
    # the register folds by octaves, so a heavy note already at the bottom of a
    # narrow register folds straight back up. The length always survives, and on a
    # sampled voice length is most of what "heavy" sounds like.
    heavy:
      octave_offset: -1
      release_multiplier: 1.5
      cutoff_multiplier: 0.6
