<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brick City Hum</title>
    <meta
      name="description"
      content="A live radio that turns Newark into music. Planes, trains, weather and tide as one continuous ambient piece."
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header>
      <h1>Brick City Hum</h1>
      <!-- Named by the server from places.yaml, so the page ships no coordinates. -->
      <span id="origin" class="origin">—</span>
      <div class="meta">
        <span id="mode">—</span>
        <span id="clock">syncing…</span>
        <span id="count">0 events</span>
        <span id="status">connecting</span>
        <button id="play" type="button" aria-pressed="false" disabled>▶ listen</button>
      </div>
    </header>
    <main>
      <canvas id="map"></canvas>
      <ul id="captions"></ul>
      <!-- SPEC §2.1: audio never starts before a user gesture. The ▶ and the voices
           arrive next; this half of Phase 1 is the picture and the shared clock. -->
      <footer>north is up · you are the dot<br />press ▶ to hear the city</footer>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
